# Template for a code-loops project profile.
#
# Layout:
#   code-loops/
#   └── projects/
#       └── <your-project-name>/
#           ├── project.yaml      ← copy this template here, edit values
#           └── brief.md          ← AUTO-GENERATED by `code-loops init` /
#                                   `code-loops resurvey <name>` (project-
#                                   surveyor agent scans target repo and
#                                   writes architecture / conventions /
#                                   glossary / key modules)
#
# Quick start (when surveyor lands in 9.22b):
#   code-loops init /absolute/path/to/your/project
#   # → creates projects/<name>/{project.yaml, brief.md}
#   code-loops run <task_id>
#   # → if exactly one project under projects/, auto-selected; otherwise
#   #   pass --project <name>

project:
  # Free-form, used in logs and meta tracking.
  name: my-project

  # Absolute path to the target project's git repo. Worktrees are created
  # off this; agents Read / Grep / Glob the source tree from here.
  base_repo: /absolute/path/to/your/project

# Project-specific knowledge (architecture, conventions, glossary, paths,
# domain concepts, integrations) lives in this markdown file. The
# project-surveyor agent auto-generates it from the target project's
# README / CLAUDE.md / source tree.
#
# Path is relative to this project.yaml file (typically just "brief.md").
# May also be absolute.
brief_file: brief.md

# OPTIONAL — test infrastructure declaration for the implementation stage.
# Defaults if absent (preserves prior code-loops behavior, fits Python
# projects with a `tests/` directory):
#
#   test_infrastructure:
#     enabled: true
#     test_paths: [tests]
#     lock_strategy: chmod_444_dir
#
# Override semantics:
#   enabled: false              → skip test_writer entirely; subtask iteration
#                                 goes straight from prompt-engineer/eval-engineer
#                                 to coder. Use for manual-QA projects or pure
#                                 docs/configs.
#   test_paths: []              → no locking even with enabled:true (rely on
#                                 git diff guard alone; useful for projects
#                                 with test files colocated with sources).
#   test_paths: [src/spec, e2e] → lock multiple dirs.
#   lock_strategy:
#     chmod_444_dir → chmod 444 the entire test_paths trees (default; safest)
#     none          → no chmod (worktree treats test_paths as advisory)
#
# Future strategies (not yet supported):
#   chmod_444_glob (e.g. *_test.go), git_diff_only (Rust embedded tests).
#
# test_infrastructure:
#   enabled: true
#   test_paths: [tests]
#   lock_strategy: chmod_444_dir
